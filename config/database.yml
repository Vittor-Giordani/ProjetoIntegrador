default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: postgres
  password: 123
  host: localhost
  port: 5432

development:
  <<: *default
  database: meu_projeto_development

test:
  <<: *default
  database: meu_projeto_test

production:
  <<: *default
  database: meu_projeto_production
  username: postgres
  password: 123
  host: localhost
  port: 5432
